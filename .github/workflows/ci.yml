name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test without screen or Accessibility permissions
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q snap-it.py tests
      - name: Check shell syntax
        run: |
          for script in *.sh; do
            bash -n "$script"
          done
